name: Test desktop application

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @cosmetics/contracts build
      - run: pnpm --filter @cosmetics/api build
      - run: pnpm --filter @cosmetics/desktop test
      - run: pnpm --filter @cosmetics/desktop build
