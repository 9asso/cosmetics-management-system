[package]
name = "cosmetics-desktop"
version = "0.1.0"
description = "Wholesale cosmetics management desktop application"
authors = ["Maison Élan"]
edition = "2021"

[lib]
name = "cosmetics_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
