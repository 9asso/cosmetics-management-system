name: cosmetics-management

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: cosmetics
      POSTGRES_USER: cosmetics
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - cosmetics-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cosmetics -d cosmetics"]
      interval: 5s
      timeout: 5s
      retries: 15

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      API_PORT: 4000
      PUBLIC_API_URL: ${PUBLIC_ORIGIN}/api/v1
      DATABASE_URL: postgresql://cosmetics:${POSTGRES_PASSWORD}@postgres:5432/cosmetics
      CORS_ORIGINS: ${PUBLIC_ORIGIN},http://tauri.localhost,https://tauri.localhost,tauri://localhost
      AUTH_SECRET: ${AUTH_SECRET}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy

  storefront:
    build:
      context: .
      dockerfile: Dockerfile.storefront
    restart: unless-stopped
    environment:
      NODE_ENV: production
      API_URL: http://api:4000/api/v1
      NEXT_PUBLIC_API_URL: /api/v1
    depends_on:
      - api

  admin:
    build:
      context: .
      dockerfile: Dockerfile.admin
    restart: unless-stopped

  gateway:
    image: nginx:1.29-alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./deploy/gateway-nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
      - storefront
      - admin

volumes:
  cosmetics-postgres:
